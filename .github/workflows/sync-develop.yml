name: Sync develop

on:
  push:
    branches: [main]

concurrency:
  group: sync-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      develop: ${{ steps.develop.outputs.exists }}
    steps:
      - name: Check whether develop exists
        id: develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/develop" > /dev/null 2> "$RUNNER_TEMP/develop-error"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "(HTTP 404)" "$RUNNER_TEMP/develop-error"; then
            echo "No develop branch yet; nothing to sync."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/develop-error"
            echo "::error::Could not check whether develop exists."
            exit 1
          fi

  merge:
    needs: decide
    if: needs.decide.outputs.develop == 'true'
    runs-on: ubuntu-latest
    environment: release-bot
    steps:
      - name: Check the release app settings
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY are not set in the release-bot environment. Follow \"Automatic releases\" in docs/releasing.md to set up the release app, then re-run this workflow."
            exit 1
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Merge main into develop
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set +e
          response="$(gh api --method POST "repos/$GITHUB_REPOSITORY/merges" \
            -f base=develop -f head="${MAIN_SHA:?}" \
            -f commit_message="🔀 merge: main(${MAIN_SHA:0:7})을 develop 에 다시 합치기" \
            --include 2> "$RUNNER_TEMP/merge-error")"
          status=$?
          set -e
          code="$(printf '%s\n' "$response" | sed -n '1s/^HTTP\/[0-9.]* \([0-9]*\).*/\1/p')"
          case "$code" in
            201)
              echo "Merged main ($MAIN_SHA) into develop."
              ;;
            204)
              echo "develop already contains main ($MAIN_SHA)."
              ;;
            409)
              if ! printf '%s\n' "$response" | grep -q '"message": *"Merge conflict"'; then
                printf '%s\n' "$response"
                echo "::error::Merging main into develop was refused (HTTP 409) for a reason other than a conflict."
                exit 1
              fi
              echo "conflict=true" >> "$GITHUB_ENV"
              echo "::warning::main ($MAIN_SHA) conflicts with develop. Opening a pull request from sync/main-to-develop to resolve it."
              ;;
            *)
              printf '%s\n' "$response"
              cat "$RUNNER_TEMP/merge-error"
              echo "::error::Merging main into develop failed (exit $status, HTTP ${code:-none})."
              exit 1
              ;;
          esac
      - name: Open a pull request to resolve the conflict
        if: env.conflict == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          branch="sync/main-to-develop"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head "$branch" --state open --json url --jq '.[0].url // ""')"
          if [ -n "$existing" ]; then
            if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" \
              -f sha="${MAIN_SHA:?}" -F force=false > /dev/null; then
              echo "::warning::$branch has commits that main does not have, so it was left as it is. Merge main into it by hand."
            fi
            echo "The conflict pull request is $existing."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" \
              -f sha="${MAIN_SHA:?}" -F force=true > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$branch" -f sha="${MAIN_SHA:?}" > /dev/null
          fi
          body="$(printf '%s\n\n%s\n' \
            "main changed in a way that conflicts with develop, so Sync develop could not merge it. develop must always contain every commit on main." \
            "Resolve the conflict on this branch by merging develop into it, then merge this pull request with a merge commit.")"
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$branch" \
            --title "🔀 merge: main 을 develop 에 다시 합치기" --body "$body"
