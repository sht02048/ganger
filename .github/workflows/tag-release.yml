name: Tag release

on:
  push:
    branches: [main]

concurrency:
  group: tag-release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      commit: ${{ steps.decide.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Decide whether the version changed
        id: decide
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release-tag.ts

  tag:
    needs: decide
    if: needs.decide.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release-bot
    steps:
      - name: Check the release app settings
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY are not set in the release-bot environment. Follow \"Automatic releases\" in docs/releasing.md to set up the release app, then re-run this workflow."
            exit 1
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create the release tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          COMMIT: ${{ needs.decide.outputs.commit }}
        run: |
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${TAG:?}" --jq '.object.type + " " + .object.sha' 2> /dev/null)"; then
            read -r existing_type existing <<< "$existing"
            if [ "$existing_type" = "tag" ]; then
              existing="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$existing" --jq .object.sha)"
            fi
            if [ "$existing" = "${COMMIT:?}" ]; then
              echo "$TAG already points at $COMMIT; nothing to do."
              exit 0
            fi
            echo "::error::$TAG already exists and points at $existing, not $COMMIT. Check it before releasing."
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=${COMMIT:?}" > /dev/null
          echo "Created $TAG at $COMMIT. Its tag push starts the Release workflow."
